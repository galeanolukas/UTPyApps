{% extends "base_layout.html" %}

{% block title %}{{ app.name }}{% endblock %}

{% block content %}
<div class="w3-row-padding">
    <div class="w3-col l8 m10 s12">
        <div class="w3-card w3-white w3-round-large w3-padding">
            <header class="w3-container w3-teal w3-round-large-top">
                <h2>{{ app.name }}</h2>
            </header>
            <div class="w3-container w3-padding">
                <p class="w3-large">{{ app.description or 'Sin descripción' }}</p>
                
                <div class="w3-row w3-margin-top">
                    <div class="w3-col s6">
                        <p><strong>Versión:</strong> {{ app.version or '1.0' }}</p>
                        <p><strong>Autor:</strong> {{ app.author or 'Anónimo' }}</p>
                    </div>
                    <div class="w3-col s6 w3-right-align">
                        <a href="/_app/{{ app.folder }}" class="w3-btn w3-teal w3-round-large w3-large">
                            <i class="w3-margin-right">▶</i> Lanzar App
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

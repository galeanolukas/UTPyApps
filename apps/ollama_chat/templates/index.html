<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat - UTPyApps</title>
    <link rel="stylesheet" href="/static/css/w3.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        body {
            background: linear-gradient(135deg, #2c001e 0%, #5e2750 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
        }
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        .sidebar.collapsed {
            width: 60px;
        }
        .sidebar-header {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .new-chat-btn {
            width: 100%;
            background: linear-gradient(135deg, #E95420 0%, #77216F 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .new-chat-btn:hover {
            opacity: 0.9;
        }
        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }
        .conversation-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .conversation-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .conversation-item.active {
            background: rgba(233, 84, 32, 0.2);
            border-color: rgba(233, 84, 32, 0.5);
        }
        .conversation-title {
            color: white;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .conversation-preview {
            color: #AEA79F;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .model-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .model-select option {
            background: #2c001e;
            color: white;
        }
        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .message {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 12px;
            max-width: 85%;
        }
        .message.user {
            background: linear-gradient(135deg, #E95420 0%, #77216F 100%);
            margin-left: auto;
        }
        .message.bot {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .message-content {
            color: white;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .input-area {
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .loading-spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #E95420;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-indicator {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
        }
        .status-running {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }
        .status-error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                <span style="color: #E95420; font-size: 16px; font-weight: 500;">🤖 Ollama Chat</span>
            </div>
            <button onclick="createNewConversation()" class="new-chat-btn">
                + Nueva Conversación
            </button>
        </div>
        <div class="conversations-list" id="conversations-list">
            <!-- Conversaciones se cargarán aquí -->
        </div>
        <div style="padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
            <a href="/" style="color: #AEA79F; text-decoration: none; font-size: 12px;">← Dashboard</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="chat-header">
            <button onclick="toggleSidebar()" class="toggle-sidebar-btn">☰</button>
            <div id="status-indicator" class="status-indicator status-error">
                <span class="loading-spinner"></span> Verificando Ollama...
            </div>
            <select id="model-select" class="model-select" style="margin-left: auto;">
                <option value="mistral:latest">mistral:latest</option>
                <option value="llama2">llama2</option>
                <option value="phi">phi</option>
            </select>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <div class="message-content">¡Hola! Soy Ollama Chat. Selecciona un modelo y comienza a chatear con IA.</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div style="display: flex; gap: 8px;">
                <input type="text" id="message-input" class="w3-input w3-round-large" 
                       style="flex: 1; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 14px;" 
                       placeholder="Escribe tu mensaje..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" class="w3-btn w3-round-large" 
                        style="background: linear-gradient(135deg, #E95420 0%, #77216F 100%); color: white; font-size: 13px; padding: 12px 24px;">
                    Enviar
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentConversationId = null;
        let chatHistory = [];

        // Verificar estado de Ollama
        function checkStatus() {
            fetch('/_app/ollama_chat/api/status')
                .then(response => response.json())
                .then(data => {
                    const statusDiv = document.getElementById('status-indicator');
                    
                    if (data.status === 'running') {
                        statusDiv.className = 'status-indicator status-running';
                        statusDiv.innerHTML = '✅ Ollama corriendo';
                        
                        // Actualizar lista de modelos
                        if (data.models && data.models.length > 0) {
                            const select = document.getElementById('model-select');
                            select.innerHTML = '';
                            data.models.forEach(model => {
                                const option = document.createElement('option');
                                option.value = model.name;
                                option.textContent = model.name;
                                select.appendChild(option);
                            });
                        }
                    } else {
                        statusDiv.className = 'status-indicator status-error';
                        statusDiv.innerHTML = '❌ Ollama no corriendo';
                    }
                })
                .catch(error => {
                    document.getElementById('status-indicator').className = 'status-indicator status-error';
                    document.getElementById('status-indicator').innerHTML = '❌ Error: ' + error.message;
                });
        }

        // Cargar conversaciones
        function loadConversations() {
            fetch('/_app/ollama_chat/api/conversations')
                .then(response => response.json())
                .then(data => {
                    const listDiv = document.getElementById('conversations-list');
                    listDiv.innerHTML = '';
                    
                    if (data.conversations && data.conversations.length > 0) {
                        data.conversations.forEach(conv => {
                            const item = document.createElement('div');
                            item.className = 'conversation-item';
                            if (conv.id === currentConversationId) {
                                item.classList.add('active');
                            }
                            item.innerHTML = `
                                <div style="display: flex; justify-content: space-between; align-items: start;">
                                    <div style="flex: 1;">
                                        <div class="conversation-title">${conv.title}</div>
                                        <div class="conversation-preview">${conv.preview || 'Sin mensajes'}</div>
                                    </div>
                                    <button onclick="event.stopPropagation(); deleteConversation(${conv.id})" class="delete-btn">🗑️</button>
                                </div>
                            `;
                            item.onclick = () => loadConversation(conv.id);
                            listDiv.appendChild(item);
                        });
                    } else {
                        listDiv.innerHTML = '<div style="color: #AEA79F; font-size: 12px; text-align: center; padding: 20px;">No hay conversaciones</div>';
                    }
                })
                .catch(error => {
                    console.error('Error cargando conversaciones:', error);
                });
        }

        // Crear nueva conversación
        function createNewConversation() {
            const model = document.getElementById('model-select').value;
            
            fetch('/_app/ollama_chat/api/conversations/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    title: 'Nueva conversación',
                    model: model
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentConversationId = data.conversation_id;
                    loadConversations();
                    clearChat();
                }
            })
            .catch(error => {
                console.error('Error creando conversación:', error);
            });
        }

        // Cargar conversación
        function loadConversation(conversationId) {
            currentConversationId = conversationId;
            
            fetch(`/_app/ollama_chat/api/conversations/${conversationId}`)
                .then(response => response.json())
                .then(data => {
                    // Actualizar modelo
                    if (data.model) {
                        document.getElementById('model-select').value = data.model;
                    }
                    
                    // Cargar mensajes
                    clearChat();
                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            addMessage(msg.role, msg.content);
                        });
                    }
                    
                    loadConversations();
                })
                .catch(error => {
                    console.error('Error cargando conversación:', error);
                });
        }

        // Eliminar conversación
        function deleteConversation(conversationId) {
            if (!confirm('¿Eliminar esta conversación?')) return;
            
            fetch(`/_app/ollama_chat/api/conversations/${conversationId}/delete`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (currentConversationId === conversationId) {
                        currentConversationId = null;
                        clearChat();
                    }
                    loadConversations();
                }
            })
            .catch(error => {
                console.error('Error eliminando conversación:', error);
            });
        }

        // Enviar mensaje
        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            const model = document.getElementById('model-select').value;
            
            if (!message) return;
            
            // Si no hay conversación, crear una
            if (!currentConversationId) {
                createNewConversation();
                // Esperar a que se cree la conversación
                setTimeout(() => sendMessage(), 100);
                return;
            }
            
            // Agregar mensaje del usuario
            addMessage('user', message);
            input.value = '';
            
            // Mostrar indicador de carga
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.id = 'loading-message';
            loadingDiv.innerHTML = '<div class="message-content"><span class="loading-spinner"></span> Pensando...</div>';
            document.getElementById('chat-messages').appendChild(loadingDiv);
            
            // Enviar a la API
            fetch('/_app/ollama_chat/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: model,
                    message: message,
                    conversation_id: currentConversationId
                })
            })
            .then(response => response.json())
            .then(data => {
                // Remover indicador de carga
                document.getElementById('loading-message').remove();
                
                if (data.response) {
                    addMessage('bot', data.response);
                } else if (data.error) {
                    addMessage('bot', 'Error: ' + data.error);
                }
            })
            .catch(error => {
                document.getElementById('loading-message').remove();
                addMessage('bot', 'Error: ' + error.message);
            });
        }

        // Agregar mensaje al chat
        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Limpiar chat
        function clearChat() {
            document.getElementById('chat-messages').innerHTML = '';
        }

        // Toggle sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        // Inicializar
        checkStatus();
        loadConversations();
        setInterval(checkStatus, 10000); // Verificar cada 10 segundos
    </script>
</body>
</html>

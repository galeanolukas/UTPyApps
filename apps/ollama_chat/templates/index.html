<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat - UTPyApps</title>
    <link rel="stylesheet" href="/static/css/w3.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        body {
            background: linear-gradient(135deg, #2c001e 0%, #5e2750 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .chat-container {
            height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .message {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 12px;
            max-width: 85%;
        }
        .message.user {
            background: linear-gradient(135deg, #E95420 0%, #77216F 100%);
            margin-left: auto;
        }
        .message.assistant {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .message-content {
            color: white;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .input-area {
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .loading-spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #E95420;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .model-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .model-select option {
            background: #2c001e;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Topbar -->
    <div class="topbar">
        <div class="w3-container w3-padding-8">
            <div class="w3-row">
                <div class="w3-col s6">
                    <span style="color: #E95420; font-size: 14px; font-weight: 500;">🤖 Ollama Chat</span>
                </div>
                <div class="w3-col s6 w3-right-align">
                    <a href="/" class="w3-text-white" style="font-size: 12px; text-decoration: none;">← Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="w3-container" style="padding-top: 70px; padding-bottom: 16px;">
        <!-- Status Card -->
        <div class="w3-card w3-round-large" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 16px;">
            <div class="w3-padding" style="padding: 12px 16px;">
                <div class="w3-row" style="align-items: center;">
                    <div class="w3-col s8">
                        <div id="ollama-status" style="color: #AEA79F; font-size: 12px;">
                            <span class="loading-spinner"></span> Verificando Ollama...
                        </div>
                    </div>
                    <div class="w3-col s4 w3-right-align">
                        <select id="model-select" class="model-select" style="width: 100%;">
                            <option value="phi">phi</option>
                            <option value="llama3:8b">llama3:8b</option>
                            <option value="gemma:2b">gemma:2b</option>
                            <option value="mistral:7b">mistral:7b</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Setup Card (si Ollama no está corriendo) -->
        <div id="setup-card" class="w3-card w3-round-large" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 16px; display: none;">
            <div class="w3-padding" style="padding: 16px;">
                <h4 style="color: white; font-size: 14px; margin: 0 0 12px 0;">⚙️ Configurar Ollama</h4>
                <p style="color: #AEA79F; font-size: 12px; margin: 0 0 12px 0;">
                    Ollama no está corriendo. Instálalo y descarga modelos para usar el chat.
                </p>
                <div style="margin-bottom: 12px;">
                    <label style="color: #AEA79F; font-size: 12px; display: block; margin-bottom: 4px;">ID del Dispositivo (ADB) - Opcional (dejar vacío para modo local):</label>
                    <input type="text" id="device-id-input" class="w3-input w3-round-large" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 12px;" placeholder="Ej: 1f7087000408 (vacío = local)">
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button onclick="installOllama()" class="w3-btn w3-round-large" style="background: linear-gradient(135deg, #E95420 0%, #77216F 100%); color: white; font-size: 12px; padding: 8px 16px;">
                        📥 Instalar Ollama
                    </button>
                    <button onclick="startOllama()" class="w3-btn w3-round-large" style="background: rgba(255, 255, 255, 0.1); color: white; font-size: 12px; padding: 8px 16px;">
                        ▶️ Iniciar Ollama
                    </button>
                    <button onclick="pullModel()" class="w3-btn w3-round-large" style="background: rgba(255, 255, 255, 0.1); color: white; font-size: 12px; padding: 8px 16px;">
                        📦 Descargar Modelo
                    </button>
                </div>
                <div id="setup-status" style="margin-top: 12px; font-size: 11px; color: #AEA79F;"></div>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="w3-card w3-round-large" style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);">
            <div class="chat-container">
                <div id="chat-messages" class="chat-messages">
                    <div class="message assistant">
                        <div class="message-content">¡Hola! Soy Ollama Chat. Selecciona un modelo y comienza a chatear con IA.</div>
                    </div>
                </div>
                <div class="input-area">
                    <div class="w3-row" style="align-items: center;">
                        <div class="w3-col s10">
                            <input type="text" id="message-input" class="w3-input w3-round-large" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 13px;" placeholder="Escribe tu mensaje..." onkeypress="if(event.key === 'Enter') sendMessage()">
                        </div>
                        <div class="w3-col s2 w3-right-align">
                            <button onclick="sendMessage()" class="w3-btn w3-round-large" style="background: linear-gradient(135deg, #E95420 0%, #77216F 100%); color: white; font-size: 12px; padding: 8px 16px; width: 100%;">
                                Enviar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let chatHistory = [];
        let currentDeviceId = null;

        // Verificar estado de Ollama
        function checkStatus() {
            fetch('/_app/ollama_chat/api/status')
                .then(response => response.json())
                .then(data => {
                    const statusDiv = document.getElementById('ollama-status');
                    const setupCard = document.getElementById('setup-card');
                    
                    if (data.status === 'running') {
                        statusDiv.innerHTML = '✅ Ollama corriendo';
                        statusDiv.style.color = '#00ff00';
                        setupCard.style.display = 'none';
                        
                        // Actualizar lista de modelos
                        if (data.models && data.models.length > 0) {
                            const select = document.getElementById('model-select');
                            select.innerHTML = '';
                            data.models.forEach(model => {
                                const option = document.createElement('option');
                                option.value = model.name;
                                option.textContent = model.name;
                                select.appendChild(option);
                            });
                        }
                    } else {
                        statusDiv.innerHTML = '❌ Ollama no corriendo';
                        statusDiv.style.color = '#e74c3c';
                        setupCard.style.display = 'block';
                    }
                })
                .catch(error => {
                    document.getElementById('ollama-status').innerHTML = '❌ Error: ' + error.message;
                    document.getElementById('setup-card').style.display = 'block';
                });
        }

        // Enviar mensaje
        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            const model = document.getElementById('model-select').value;
            
            if (!message) return;
            
            // Agregar mensaje del usuario
            addMessage('user', message);
            chatHistory.push({ role: 'user', content: message });
            input.value = '';
            
            // Mostrar indicador de carga
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-message';
            loadingDiv.innerHTML = '<div class="message-content"><span class="loading-spinner"></span> Pensando...</div>';
            document.getElementById('chat-messages').appendChild(loadingDiv);
            
            // Enviar a la API
            fetch('/_app/ollama_chat/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: model,
                    message: message,
                    history: chatHistory
                })
            })
            .then(response => response.json())
            .then(data => {
                // Remover indicador de carga
                document.getElementById('loading-message').remove();
                
                if (data.response) {
                    addMessage('assistant', data.response);
                    chatHistory.push({ role: 'assistant', content: data.response });
                } else if (data.error) {
                    addMessage('assistant', 'Error: ' + data.error);
                }
            })
            .catch(error => {
                document.getElementById('loading-message').remove();
                addMessage('assistant', 'Error: ' + error.message);
            });
        }

        // Agregar mensaje al chat
        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Instalar Ollama
        function installOllama() {
            const statusDiv = document.getElementById('setup-status');
            statusDiv.innerHTML = '<span class="loading-spinner"></span> Instalando Ollama...';
            
            // Obtener device_id de ADB Manager si está disponible
            currentDeviceId = getDeviceId();
            
            fetch('/_app/ollama_chat/api/install', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id: currentDeviceId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.innerHTML = '✅ Ollama instalado. Inicia el servidor.';
                } else {
                    statusDiv.innerHTML = '❌ Error: ' + data.error;
                }
            })
            .catch(error => {
                statusDiv.innerHTML = '❌ Error: ' + error.message;
            });
        }

        // Iniciar Ollama
        function startOllama() {
            const statusDiv = document.getElementById('setup-status');
            statusDiv.innerHTML = '<span class="loading-spinner"></span> Iniciando Ollama...';
            
            currentDeviceId = getDeviceId();
            
            fetch('/_app/ollama_chat/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id: currentDeviceId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.innerHTML = '✅ Ollama iniciado. Verificando estado...';
                    setTimeout(checkStatus, 2000);
                } else {
                    statusDiv.innerHTML = '❌ Error: ' + data.error;
                }
            })
            .catch(error => {
                statusDiv.innerHTML = '❌ Error: ' + error.message;
            });
        }

        // Descargar modelo
        function pullModel() {
            const model = document.getElementById('model-select').value;
            const statusDiv = document.getElementById('setup-status');
            statusDiv.innerHTML = `<span class="loading-spinner"></span> Descargando ${model}...`;
            
            currentDeviceId = getDeviceId();
            
            fetch('/_app/ollama_chat/api/pull', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: model, device_id: currentDeviceId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.innerHTML = '✅ Modelo descargado. Verificando estado...';
                    setTimeout(checkStatus, 2000);
                } else {
                    statusDiv.innerHTML = '❌ Error: ' + data.error;
                }
            })
            .catch(error => {
                statusDiv.innerHTML = '❌ Error: ' + error.message;
            });
        }

        // Obtener device_id de ADB Manager
        function getDeviceId() {
            // Prioridad: campo de entrada > URL > localStorage
            const input = document.getElementById('device-id-input');
            if (input && input.value.trim()) {
                return input.value.trim();
            }
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('device_id') || localStorage.getItem('adb_device_id') || null;
        }

        // Verificar estado al cargar
        checkStatus();
        setInterval(checkStatus, 10000); // Verificar cada 10 segundos
    </script>
</body>
</html>

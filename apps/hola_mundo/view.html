<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP_NAME - UTPYAPPS</title>
    <link rel="stylesheet" href="/static/css/w3.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <script src="/static/js/common.js"></script>
</head>
<body class="w3-light-grey">
    <!-- Header -->
    <header class="w3-container w3-teal w3-padding-24">
        <div class="w3-row">
            <div class="w3-col s8">
                <h1 class="w3-xxlarge">
                    <img src="/static/images/ubuntu-touch-logo.svg" style="width:40px;height:40px;vertical-align:middle;margin-right:10px;">
                    UTPYAPPS
                </h1>
                <p class="w3-large">Meta-lanzador para aplicaciones Python en Ubuntu Touch</p>
            </div>
            <div class="w3-col s4 w3-right-align">
                <a href="/" class="w3-btn w3-large w3-round-large w3-white w3-text-teal">
                    ← Dashboard
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w3-container w3-padding-16">
<div class="w3-row-padding">
    <div class="w3-col l8 m10 s12">
        <div class="w3-card w3-white w3-round-large w3-padding">
            <header class="w3-container w3-teal w3-round-large-top">
                <h2>APP_NAME</h2>
            </header>
            <div class="w3-container w3-padding">
                <div class="w3-center w3-padding-32">
                    <i class="w3-xxxlarge w3-text-teal">👋</i>
                    <h3 class="w3-text-teal">¡Hola Mundo!</h3>
                    <p class="w3-large">Esta es tu primera aplicación UTPYAPPS</p>
                </div>
                
                <div class="w3-row w3-margin-top">
                    <div class="w3-col s12">
                        <button onclick="saludar()" class="w3-btn w3-teal w3-round-large w3-block w3-large">
                            <i class="w3-margin-right">👋</i> Saludar
                        </button>
                    </div>
                </div>
                
                <div id="mensaje" class="w3-margin-top w3-hide">
                    <div class="w3-panel w3-teal w3-round-large">
                        <p id="texto-mensaje" class="w3-large"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function saludar() {
    const mensajes = [
        '¡Hola desde UTPYAPPS!',
        '¡Bienvenido al meta-lanzador!',
        '¡Tu app funciona perfectamente!',
        '¡Ubuntu Touch + Python = ❤️!'
    ];
    
    const mensajeAleatorio = mensajes[Math.floor(Math.random() * mensajes.length)];
    document.getElementById('texto-mensaje').textContent = mensajeAleatorio;
    document.getElementById('mensaje').classList.remove('w3-hide');
}
</script>
    </main>
</body>
</html>
